# File: compose.yaml
# Purpose: Run the development application and PostgreSQL/pgvector services.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23
name: autodocs

services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspaces/AutoDocsGenAI:cached
      - model_cache:/models
    environment:
      AUTODOCS_CONFIG_FILE: ${AUTODOCS_CONFIG_FILE:-config/config.yaml}
      AUTODOCS_HTTP_TIMEOUT_SECONDS: ${AUTODOCS_HTTP_TIMEOUT_SECONDS:-30}
      AUTODOCS_HTTP_USER_AGENT: ${AUTODOCS_HTTP_USER_AGENT:-AutoDocPipeline/0.1 (Documentation Knowledge Pipeline)}
      AUTODOCS_OLLAMA_URL: ${AUTODOCS_OLLAMA_URL:-http://127.0.0.1:11434}
      AUTODOCS_EMBEDDING_THREADS: ${AUTODOCS_EMBEDDING_THREADS:-2}
      AUTODOCS_DB_CONNECT_TIMEOUT_SECONDS: ${AUTODOCS_DB_CONNECT_TIMEOUT_SECONDS:-10}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-autodocs}
      POSTGRES_USER: ${POSTGRES_USER:-autodocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodocs-local-change-me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autodocs}:${POSTGRES_PASSWORD:-autodocs-local-change-me}@postgres:5432/${POSTGRES_DB:-autodocs}
      FASTEMBED_CACHE_PATH: /models/fastembed
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autodocs}
      POSTGRES_USER: ${POSTGRES_USER:-autodocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodocs-local-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-autodocs} -d ${POSTGRES_DB:-autodocs}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  model_cache:
