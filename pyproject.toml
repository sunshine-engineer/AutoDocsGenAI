[project]
name = "auto-doc-generator"
version = "0.1.0"
description = "Source-grounded pipeline for generating technical documentation from official package docs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.13",
    "colorlog>=6.9",
    "fastembed>=0.8,<1",
    "httpx>=0.28",
    "langchain>=0.3",
    "langchain-google-genai>=2.1",
    "langgraph>=0.4",
    "markdownify>=1.2",
    "playwright>=1.55",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# EXE002 is a Windows bind-mount portability false positive:
# source files may appear executable inside the container.
# Do not add broader rule exclusions.
ignore = ["EXE002"]

[tool.mypy]
python_version = "3.12"
files = [
    "config",
    "database",
    "discovery",
    "indexing",
    "ingestion",
    "planner",
    "scripts",
    "tests",
]
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true


