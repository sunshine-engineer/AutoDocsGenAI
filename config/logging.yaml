# File: config/logging.yaml
# Purpose: Configure console/file logging for the documentation pipeline.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23
version: 1

disable_existing_loggers: false

formatters:

  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

handlers:

  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: .logs/pipeline.log

root:
  level: INFO
  handlers:
    - console
    - file
